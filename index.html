<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Survey Form</title>
<!-- Linked CSS file -->
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<h1 id="title">My Survey Form</h1>
<p id="description">We’d love your feedback! Please fill out this quick survey.</p>


<form id="survey-form">
<label id="name-label" for="name">Name:</label>
<input id="name" type="text" placeholder="Enter your full name" required />


<label id="email-label" for="email">Email:</label>
<input id="email" type="email" placeholder="Enter your email address" required />


<label id="number-label" for="number">Age (optional):</label>
<input id="number" type="number" min="10" max="99" placeholder="Enter your age" />


<label for="dropdown">Which best describes you?</label>
<select id="dropdown" required>
<option disabled selected value="">Select an option</option>
<option value="student">Student</option>
<option value="professional">Professional</option>
<option value="other">Other</option>
</select>


<p>Would you recommend us?</p>
<label><input type="radio" name="recommend" value="yes" required /> Yes</label>
<label><input type="radio" name="recommend" value="no" /> No</label>


<p>What topics are you interested in?</p>
<label><input type="checkbox" value="html" /> HTML</label>
<label><input type="checkbox" value="css" /> CSS</label>
<label><input type="checkbox" value="javascript" /> JavaScript</label>
<label><input type="checkbox" value="other" /> Other</label>


<label for="comments">Additional Comments:</label>
<textarea id="comments" rows="4" cols="40" placeholder="Enter your comments here..."></textarea>


<button id="submit" type="submit">Submit</button>
</form>
</body>
</html>
